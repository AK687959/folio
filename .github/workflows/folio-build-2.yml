
name: Build Folio APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Folio source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          packages: 'platform-tools platforms;android-37.0'

      - name: Configure Android SDK location
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"

            if [[ -z "$SDKMANAGER" ]]; then
              echo "ERROR: Cannot locate Android SDK or sdkmanager."
              exit 1
            fi

            SDK_ROOT="$(cd "$(dirname "$SDKMANAGER")/../../.." && pwd)"
          fi

          if [[ ! -d "$SDK_ROOT/platforms" ]]; then
            echo "ERROR: Android SDK platforms directory not found at $SDK_ROOT"
            exit 1
          fi

          echo "Android SDK found at: $SDK_ROOT"

          printf 'sdk.dir=%s\n' "$SDK_ROOT" > apps/mobile/local.properties

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          if [[ -d "$SDK_ROOT/platforms/android-37.0" ]] && [[ ! -e "$SDK_ROOT/platforms/android-37" ]]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi

      - name: Install Folio dependencies
        run: bun install --frozen-lockfile

      - name: Build Folio debug APK
        run: bun run build:android

      - name: Upload Folio APK
        uses: actions/upload-artifact@v7
        with:
          name: Folio-Android-APK
          path: apps/mobile/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error
          retention-days: 7
